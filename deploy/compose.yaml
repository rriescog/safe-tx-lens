services:
  app:
    image: ${IMAGE:?Set the immutable GHCR image digest}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      SAFE_API_KEY_FILE: /run/secrets/safe_api_key
      COMMUNITY_QUOTA_FILE: /data/community-quota.json
      COMMUNITY_DAILY_UNITS: ${COMMUNITY_DAILY_UNITS:-600}
      COMMUNITY_MONTHLY_UNITS: ${COMMUNITY_MONTHLY_UNITS:-10000}
      COMMUNITY_CLIENT_DAILY_REQUESTS: ${COMMUNITY_CLIENT_DAILY_REQUESTS:-20}
    secrets:
      - safe_api_key
    volumes:
      - quota:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  quota:
  caddy_data:
  caddy_config:
secrets:
  safe_api_key:
    file: ./safe-api-key
